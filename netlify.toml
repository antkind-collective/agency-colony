[build]
  # Version string = YYYYMMDD-g<short sha>, stamped fresh on every build. Deliberately NOT `git describe`:
  # Netlify builds from a shallow clone, so describe can't see the v2.3.0 tag
  # (275 commits back) and silently degraded to a bare sha — which is what
  # shipped on 24 Aug 2026. `rev-list --count` is no substitute: in a shallow
  # clone it returns 1. Date + sha needs no history, so it can't regress.
  # No hand-typed base since 28 Sep 2026 (Alex): a "v2.3.0" prefix sat
  # unchanged through every deploy after the public release and made Colony
  # look stale. The public agency-colony export sets its own semver.
  # Asset ?v= are CONTENT hashes (_build/hash-assets.mjs, C2 24 Sep 2026), not
  # the deploy version: an unchanged file keeps its URL, so visitors re-fetch
  # only what a deploy actually changed. It runs after build-circle.mjs because
  # Circle's page is hashed against the stripped files clients.youragency.com serves.
  command = "node _build/apply-identity.mjs && VER=\"$(date -u +%Y%m%d)-g$(git rev-parse --short HEAD)\" && echo \"var APP_VERSION = '${VER}';\" > version.js && node _build/hash-assets.mjs"
  publish = "."
  functions = "netlify/functions"
  # TRAP (11 Sep 2026): this ignore rule also cancels a MANUAL "Trigger deploy"
  # when nothing has been committed — so adding an env var and pressing the
  # button in the dashboard builds nothing. To pick up new env vars, push a
  # commit that touches a non-markdown file (this comment was one).

# Deploy previews ENABLED (PR-based) for pre-live testing. They inherit the
# main [build] ignore rule, so doc-only PRs still skip. Auth on a preview URL
# works because sign-in uses redirectTo: window.location.origin and the
# https://deploy-preview-*--youragency.netlify.app/** pattern is in Supabase's Redirect
# URLs. Never widen it to *.netlify.app: anyone can host one (S12, 25 Sep 2026).
# Branch deploys stay disabled so backup/* branches don't consume build minutes.
[context.branch-deploy]
  ignore = "true"

[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "AGENCY_ADMIN_EMAIL,AGENCY_NAME,APP_BASE_URL,SUPABASE_URL,SUPABASE_ANON_KEY,EMAIL_SENDER,LOGIN_GOOGLE,LOGIN_EMAIL"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive, nosnippet"
    # Nothing may frame Colony or Circle (audit 16 Sep 2026). Every destructive
    # control here is one click for a signed-in person — approve a hire, archive
    # a client, send an agreement — so a hostile page that frames the app and
    # dresses the click up as its own is the whole clickjacking attack. Nothing
    # in this codebase frames or is framed (no <iframe>, no window.top), so DENY
    # costs nothing. X-Frame-Options for old browsers, frame-ancestors for the
    # rest; frame-ancestors is the ONLY CSP directive set — an unlisted
    # directive is unrestricted, so this cannot break inline scripts or styles.
    X-Frame-Options = "DENY"
    Content-Security-Policy = "frame-ancestors 'none'"
    X-Content-Type-Options = "nosniff"
    # Colony deep links carry record ids (?open=hire:<uuid>). Without this, a
    # click on any outbound link — a Drive doc, a client's site — hands that
    # full URL to the other site as the Referer.
    Referrer-Policy = "strict-origin-when-cross-origin"

# HTML must always be revalidated so new ?v= cache-bust strings take effect
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache"

# JS/CSS with ?v= hash can be cached aggressively
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/vendor/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ── Repo files are not the website (24 Sep 2026) ─────────────────────────
# publish = "." serves the whole repository, so until today anyone on the
# internet could download, on BOTH hosts and without signing in: CLAUDE.md,
# docs/ (OPEN.md's open security items, SCHEMA.md's every table and policy,
# the security audit reports), every migration, the tests, the function
# source, and setup/ + sample_data/ CSVs naming staff with their personal
# Gmail addresses. No secret was exposed (.env and scripts/sql.sh are not
# tracked). These rules come first because the first matching rule wins.
# tests/public-surface.test.mjs fails on any tracked file that is neither on
# its public list nor blocked here — a new file is private until classified.
[[redirects]]
  from = "/docs/*"
  to = "/404.html"
  status = 404
  force = true

