[functions."daily-reminders"]
  schedule = "30 4 * * *"

# 11:00 LOCAL weekday task nudge (only for people who have not touched tasks).
# Every 30 minutes, not once a day: the function emails whoever is currently at
# their own local 11, so it has to be awake for every zone. Half-hourly rather
# than hourly because India is UTC+5:30 — an on-the-hour cron would never land
# on 11:00 IST and would therefore never nudge anyone. The weekday filter is
# per-person too (a Monday in Tokyo is still Sunday in Los Angeles), so the
# cron itself stays 7-day. task-nudge returns `quiet` on the ~45 runs a day
# that are nobody's 11 AM, so those write no heartbeat.
[functions."task-nudge"]
  schedule = "0,30 * * * *"

# 10:00 IST every day. The function itself refuses to send on weekends and
# public holidays — the working-day countdown is happy to say "one day left"
# on a Saturday, so the guard is what keeps it off people's weekends.
# 09:30 IST, half an hour before the other crons: a joiner activated on their
# start date should be set up BEFORE the 10:00 task nudge decides whether to
# chase them.
[functions."scheduled-activation"]
  schedule = "0 4 * * *"

# 09:15 IST: retry adding Colony-created accounts to all@youragency.com, and name
# any active employee who is not on it (report only).
# Every six hours: retry @youragency.com accounts Google refused for want of a
# licence; Colony has already asked Example Reseller for the seat (7 Oct 2026).
[functions."workspace-retry"]
  schedule = "10 */6 * * *"

[functions."workspace-group-sync"]
  schedule = "45 3 * * *"

[functions."brief-deadline-reminder"]
  schedule = "30 4 * * *"

# 10:30 IST, half an hour after the deadline reminders, so a coordinator who is
# cc'd on both does not get two Colony emails in the same second.
[functions."brief-approval-nudge"]
  schedule = "0 5 * * *"

# 10:45 IST — the Your Agency-side mirror of the approval nudge.
[functions."brief-pickup-nudge"]
  schedule = "15 5 * * *"

# Delivered briefs the client has not answered in 7 days close as complete (30 Sep 2026).
[functions."brief-auto-complete"]
  schedule = "45 4 * * *"

# Fixed-term hires: email the setup approvers 30 days before the end date (6 Oct 2026).
[functions."contract-end-reminder"]
  schedule = "50 4 * * *"

# Full-time probation: email the hiring manager 15 days before it ends (3 Nov 2026). 10:25 IST.
[functions."probation-reminder"]
  schedule = "55 4 * * *"

# Joiner welcome: 2 working days before the start date (7 Oct 2026). 09:00 IST, every day.
# 09:00 IST: S7 emergency contact reminder, sent only on the working day
# before app_config emergency_contact_deadline (7 Oct 2026).
# 00:05 IST: pause anyone still without an emergency contact once the
# deadline has passed (7 Oct 2026). Saving a contact lifts it.
[functions."emergency-contact-pause"]
  schedule = "35 18 * * *"

[functions."emergency-contact-reminder"]
  schedule = "30 3 * * *"

[functions."hire-welcome"]
  schedule = "30 3 * * *"

# Joiner meetings: add to All Hands + Thirsty Thursday after first sign-in (7 Oct 2026). Hourly.
[functions."joiner-calendar"]
  schedule = "20 * * * *"

# Joiner Slack check: in #youragency-all + #youragency-random? (7 Oct 2026). Hourly.
[functions."joiner-slack"]
  schedule = "25 * * * *"

# 09:45 IST: grant streak rewards (a half-day every 50 streak days) and email
# the earner + an FYI to their leave approver. Morning, so yesterday counts.
[functions."streak-rewards"]
  schedule = "15 4 * * *"

[functions."invoice-reminder"]
  schedule = "30 4 * * *"

[functions."policy-update-reminder"]
  schedule = "30 4 * * 1"

# 09:00 IST daily: remind Alex of client feedback on Circle still open on
# day 2, 4, 6 … after it was posted, until she marks it fixed (6 Oct 2026).
[functions."client-feedback-reminder"]
  schedule = "30 3 * * *"

# Tuesday 10:00 IST (not Monday): the AM team gets Monday to upload unprompted;
# the function itself skips anyone who has already uploaded this week.
[functions."analytics-upload-reminder"]
  schedule = "30 4 * * 2"

# Monday 10:00 IST: last week's website traffic from Google Analytics, for
# every client in app_config.website_analytics (26 Oct 2026), plus Google Search
# (Search Console) where a search_site is set (3 Nov). Weekly, with the
# other reports, not daily.
[functions."website-analytics-sync"]
  schedule = "30 4 * * 1"

# Registrations from Rishi's media dashboard sheet (Example Collective, 5 Nov
# 2026): re-read every morning, 10:10 IST. Read-only (lib/registrations.js).
[functions."registrations-sync"]
  schedule = "40 4 * * *"
