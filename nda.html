<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>NDA with Your Agency</title>
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<style>
  :root { --bg: #fffff7; --ink: #2f2e2a; --soft: #4a4944; --muted: #6b6a63; --line: #cfcdc3; --bad: #b3261e; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 Arial, Helvetica, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 40px 16px 64px; }
  .brand { font-size: 12px; letter-spacing: .12em; color: var(--muted); }
  h1 { font-size: 22px; margin: 8px 0 20px; text-wrap: balance; }
  form { display: flex; flex-direction: column; gap: 12px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--soft); }
  input, select { font: inherit; color: var(--ink); background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; width: 100%; }
  input:focus, select:focus { outline: 2px solid var(--ink); outline-offset: 1px; }
  button { align-self: flex-start; font: inherit; font-weight: 700; background: var(--ink); color: var(--bg); border: 0; border-radius: 8px; padding: 10px 18px; cursor: pointer; margin-top: 4px; }
  button:disabled { opacity: .5; cursor: default; }
  .err { color: var(--bad); font-size: 13px; min-height: 1em; }
  .note { color: var(--soft); }
  [hidden] { display: none !important; }
  @media (max-width: 520px) { .row { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main>
  <div class="brand">AGENCY</div>
  <h1 id="title">NDA with Your Agency</h1>

  <p id="loading" class="note">Loading…</p>
  <p id="closed" class="note" hidden>This link has been used or has expired. If you still need to sign, ask the person who sent it for a new one.</p>
  <p id="done" class="note" hidden>Thanks, we've got this. The NDA will come to your email for signing.</p>

  <form id="form" hidden novalidate>
    <label>Company or full name
      <input name="party_name" maxlength="160" autocomplete="organization" required></label>
    <div class="row">
      <label>Type
        <select name="party_type" required>
          <option value="">Choose</option>
          <option value="pvt_ltd">Private Limited company</option>
          <option value="public_ltd">Public Limited company</option>
          <option value="llp">LLP</option>
          <option value="partnership">Partnership firm</option>
          <option value="proprietorship">Sole proprietorship</option>
          <option value="individual">Individual</option>
          <option value="foreign">Company outside India</option>
        </select></label>
      <label>Registered address
        <input name="party_address" maxlength="300" autocomplete="street-address" required></label>
    </div>
    <div class="row">
      <label>Signing name
        <input name="signatory_name" maxlength="120" autocomplete="name" required></label>
      <label>Title
        <input name="signatory_title" maxlength="120" autocomplete="organization-title"></label>
    </div>
    <label>Email
      <input name="signatory_email" type="email" maxlength="200" autocomplete="email" required></label>
    <p class="err" id="err" role="alert"></p>
    <button type="submit" id="submit">Submit</button>
  </form>
</main>
<script>
(function () {
  // The link's code is in the #fragment, so it never reaches a server log.
  var token = location.hash.replace(/^#/, '');
  history.replaceState(null, '', location.pathname);
  var $ = function (id) { return document.getElementById(id); };
  var show = function (id) { ['loading', 'closed', 'done', 'form'].forEach(function (x) { $(x).hidden = x !== id; }); };
  function post(payload) {
    return fetch('/.netlify/functions/nda-intake', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(Object.assign({ token: token }, payload))
    }).then(function (r) { return r.json().then(function (j) { return { ok: r.ok, body: j }; }); });
  }
  if (!token) { show('closed'); return; }
  post({ action: 'view' }).then(function (r) {
    if (r.body.state !== 'open') { show('closed'); return; }
    $('title').textContent = 'NDA with Your Agency: ' + r.body.purpose;
    show('form');
  }).catch(function () { show('closed'); });

  $('form').addEventListener('submit', function (e) {
    e.preventDefault();
    var f = e.target, details = {};
    ['party_name', 'party_type', 'party_address', 'signatory_name', 'signatory_title', 'signatory_email'].forEach(function (k) { details[k] = f.elements[k].value; });
    $('err').textContent = '';
    $('submit').disabled = true;
    post({ action: 'submit', details: details }).then(function (r) {
      if (r.body.state === 'done') { show('done'); return; }
      if (r.body.state === 'closed') { show('closed'); return; }
      $('err').textContent = r.body.error || 'Something went wrong. Try again.';
      $('submit').disabled = false;
    }).catch(function () { $('err').textContent = 'Something went wrong. Try again.'; $('submit').disabled = false; });
  });
})();
</script>
</body>
</html>
